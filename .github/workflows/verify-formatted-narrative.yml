name: Verify formatted narrative branch

on:
  workflow_run:
    workflows:
      - Format narrative working branch
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'feat/narrative-production-v1-20261025')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout formatted branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: feat/narrative-production-v1-20261025
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - name: Install reproducibly
        run: npm ci --no-audit --no-fund
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit
        run: npm audit --audit-level=high
