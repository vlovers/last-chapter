name: One-time PR9 formatting repair
on:
  push:
    branches:
      - feat/natali-clue-board-frank-20261025
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Format only files reported by PR9 quality CI
        run: |
          npx prettier --write \
            docs/design/CHARACTER-DIALOGUE-BIBLE-v1.md \
            docs/design/NATALI-PLAYTEST-20261025.md \
            public/phaser-prototype/interactions.js \
            public/phaser-prototype/scene.js \
            src/game/exploration.ts \
            src/phaser/clue-board.ts \
            src/phaser/journal-facts.ts \
            src/phaser/story-panels.ts \
            tests/phaser-stage-guards.test.ts
      - name: Commit formatting changes without rewriting history
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/design/CHARACTER-DIALOGUE-BIBLE-v1.md docs/design/NATALI-PLAYTEST-20261025.md public/phaser-prototype/interactions.js public/phaser-prototype/scene.js src/game/exploration.ts src/phaser/clue-board.ts src/phaser/journal-facts.ts src/phaser/story-panels.ts tests/phaser-stage-guards.test.ts
            git commit -m "style(pr9): normalize upstream formatting"
            git push origin HEAD:feat/natali-clue-board-frank-20261025
          fi
