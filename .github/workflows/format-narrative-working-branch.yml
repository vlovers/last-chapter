name: Format narrative working branch

on:
  push:
    branches:
      - narrative/customer-orders-design-20261026

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format --if-present
      - name: Apply Prettier to all tracked files
        run: npx prettier --write .
      - name: Commit formatting only when necessary
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: normalize narrative branch formatting"
          git push origin HEAD:narrative/customer-orders-design-20261026
