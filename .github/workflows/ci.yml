name: CI
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - name: Install reproducibly
        run: npm ci --no-audit --no-fund
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit
        run: npm audit --audit-level=high

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - name: Install reproducibly
        run: npm ci --no-audit --no-fund
      - name: Install optional browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Browser QA
        env:
          BROWSER_CHANNEL: chromium
          QA_OUTPUT: /tmp/last-chapter-qa
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/last-chapter-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:5173/
          QA_OUTPUT=/tmp/last-chapter-qa/legacy npm run test:browser
          QA_OUTPUT=/tmp/last-chapter-qa/five-day npm run test:browser:v5
          QA_OUTPUT=/tmp/last-chapter-qa/mobile npm run test:browser:mobile
          QA_OUTPUT=/tmp/last-chapter-qa/frank node scripts/qa-frank-overhaul.mjs
          QA_OUTPUT=/tmp/last-chapter-qa/recovery node scripts/qa-production-recovery.mjs
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: last-chapter-browser-qa
          path: /tmp/last-chapter-qa
          retention-days: 7
