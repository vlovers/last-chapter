name: CI
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
# Superseded commits should not keep obsolete browser matrices running.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - name: Install reproducibly
        run: npm ci --no-audit --no-fund
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit
        run: npm audit --audit-level=high

  browser:
    name: Browser QA / ${{ matrix.suite.name }}
    # The observed hosted image already supplies Chromium's shared libraries
    # and Liberation fonts. Pin that OS family instead of changing dependencies
    # implicitly when ubuntu-latest migrates.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: standard
            command: npm run test:browser
          - name: five-day
            command: npm run test:browser:v5
          - name: mobile
            command: npm run test:browser:mobile
          - name: frank
            command: node scripts/qa-frank-overhaul.mjs
          - name: finale
            command: node scripts/qa-finale-matrix.mjs
          # All ten scenarios at both widths. The fixture balances long routes
          # across these existing groups; five core routes exceeded 20 minutes
          # including setup/cleanup on run 42070187073 despite passing assertions.
          - name: narrative-v2-360-core
            command: QA_WIDTH=360 QA_GROUP=core node scripts/qa-narrative-v2.mjs
          - name: narrative-v2-390-core
            command: QA_WIDTH=390 QA_GROUP=core node scripts/qa-narrative-v2.mjs
          - name: narrative-v2-360-investigation
            command: QA_WIDTH=360 QA_GROUP=investigation node scripts/qa-narrative-v2.mjs
          - name: narrative-v2-390-investigation
            command: QA_WIDTH=390 QA_GROUP=investigation node scripts/qa-narrative-v2.mjs
          - name: narrative-v2-360-daily
            command: QA_WIDTH=360 QA_GROUP=daily node scripts/qa-narrative-v2.mjs
          - name: narrative-v2-390-daily
            command: QA_WIDTH=390 QA_GROUP=daily node scripts/qa-narrative-v2.mjs
          - name: save-recovery
            command: npm run test:browser:save-recovery
          - name: ux-ui
            command: npm run test:browser:ux
          - name: performance
            command: node scripts/qa-bookshop-performance.mjs
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - name: Install reproducibly
        run: npm ci --no-audit --no-fund
      - name: Install browser tooling
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.0
          # --with-deps re-downloaded optional fonts for over nine minutes in
          # run 42201187341. Keep the same pinned Chromium and host validation;
          # the actual browser launch still fails if a required library is absent.
          npx playwright install chromium
      - name: Start game server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/last-chapter-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:5173/ > /dev/null
      - name: Run ${{ matrix.suite.name }} browser checks
        env:
          BROWSER_CHANNEL: chromium
          QA_OUTPUT: /tmp/last-chapter-qa
        run: ${{ matrix.suite.command }}
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vite-log-${{ matrix.suite.name }}
          path: /tmp/last-chapter-vite.log
          if-no-files-found: ignore
      - name: Upload UX/UI browser evidence
        if: always() && matrix.suite.name == 'ux-ui'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ux-ui-browser-qa
          path: /tmp/last-chapter-qa
          if-no-files-found: ignore
      - name: Upload finale matrix evidence
        if: always() && matrix.suite.name == 'finale'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finale-matrix-browser-qa
          path: /tmp/last-chapter-qa
          if-no-files-found: ignore
      - name: Upload performance measurements
        if: always() && matrix.suite.name == 'performance'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-performance-browser-qa
          path: /tmp/last-chapter-qa
          if-no-files-found: ignore
      - name: Upload five-day narrative journeys
        if: always() && startsWith(matrix.suite.name, 'narrative-v2-')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.suite.name }}-mobile-journeys
          path: /tmp/last-chapter-qa
          if-no-files-found: ignore
      - name: Upload responsive and Frank evidence
        if: always() && (matrix.suite.name == 'mobile' || matrix.suite.name == 'frank')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interaction-qa-${{ matrix.suite.name }}
          path: /tmp/last-chapter-qa
          if-no-files-found: ignore
