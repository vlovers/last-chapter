name: CI
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - name: Install reproducibly
        run: npm ci --no-audit --no-fund
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit
        run: npm audit --audit-level=high

  browser:
    name: Browser QA / ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: standard
            command: npm run test:browser
          - name: five-day
            command: npm run test:browser:v5
          - name: mobile
            command: npm run test:browser:mobile
          - name: frank
            command: node scripts/qa-frank-overhaul.mjs
          - name: finale
            command: node scripts/qa-finale-matrix.mjs
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - name: Install reproducibly
        run: npm ci --no-audit --no-fund
      - name: Install browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Start game server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/last-chapter-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:5173/ > /dev/null
      - name: Run ${{ matrix.suite.name }} browser checks
        env:
          BROWSER_CHANNEL: chromium
          QA_OUTPUT: /tmp/last-chapter-qa
        run: ${{ matrix.suite.command }}
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vite-log-${{ matrix.suite.name }}
          path: /tmp/last-chapter-vite.log
          if-no-files-found: ignore
      - name: Upload finale matrix evidence
        if: always() && matrix.suite.name == 'finale'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finale-matrix-browser-qa
          path: /tmp/last-chapter-qa
          if-no-files-found: ignore
