name: Format narrative working branch

on:
  push:
    branches:
      - feat/narrative-production-v1-20261025
    paths:
      - '.github/workflows/format-narrative-branch.yml'
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: narrative-format-branch
  cancel-in-progress: false

jobs:
  format:
    if: github.ref == 'refs/heads/feat/narrative-production-v1-20261025'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format and push on the latest branch head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            # A content agent may push while this job is running. Always
            # reformat the newest remote tree instead of pushing a stale SHA.
            git fetch origin feat/narrative-production-v1-20261025
            git reset --hard FETCH_HEAD
            npm run format
            if git diff --quiet; then
              echo "No formatting changes"
              exit 0
            fi
            git add -u
            git commit -m "style: normalize narrative branch formatting"
            if git push origin HEAD:feat/narrative-production-v1-20261025; then
              exit 0
            fi
            echo "Remote advanced during formatting (attempt ${attempt}); retrying"
            sleep "$((attempt * 2))"
          done
          echo "Unable to publish formatting after 5 retries" >&2
          exit 1
