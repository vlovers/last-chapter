name: Format narrative working branch

on:
  push:
    branches:
      - feat/narrative-production-v1-20261025
    paths:
      - '.github/workflows/format-narrative-branch.yml'
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: narrative-format-branch
  cancel-in-progress: false

jobs:
  format:
    if: github.ref == 'refs/heads/feat/narrative-production-v1-20261025'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: normalize narrative branch formatting"
          git push origin HEAD:feat/narrative-production-v1-20261025
