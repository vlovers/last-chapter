name: One-time dependency security update
on:
  push:
    branches:
      - chore/engineering-bootstrap
    paths:
      - .github/workflows/dependency-repair.yml
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout target branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: chore/engineering-bootstrap
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - name: Upgrade vulnerable test runner
        run: |
          npm install --save-dev 'vitest@^5.0.5' --no-audit --no-fund
          npm run format
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=high
      - name: Commit verified security update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/dependency-repair.yml
          git add -A
          git commit -m 'fix(deps): update Vitest and vulnerable worker dependencies'
          git push origin HEAD:chore/engineering-bootstrap
