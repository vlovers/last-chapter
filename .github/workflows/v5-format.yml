name: One-time V5 formatting
on:
  push:
    branches:
      - feat/unified-five-day-phaser-v5
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write scripts/qa-phaser-v5.mjs public/phaser-prototype/interactions.js public/phaser-prototype/scene.js tests/phaser-five-day-story.test.ts
      - name: Commit formatting changes to feature branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style(v5): finalize canonical Phaser gameplay files"
            git push origin HEAD:feat/unified-five-day-phaser-v5
          fi
