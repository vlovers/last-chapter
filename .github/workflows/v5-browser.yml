name: V5 browser verification
on:
  push:
    branches:
      - feat/unified-five-day-phaser-v5
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Start Vite
        run: |
          nohup npm run dev -- --host 127.0.0.1 > /tmp/last-chapter-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/last-chapter-vite.log
          exit 1
      - name: Run V5 root browser smoke
        env:
          PLAYWRIGHT_MODULE: ./node_modules/playwright/index.mjs
          QA_OUTPUT: /tmp/last-chapter-v5-qa
        run: npm run test:browser:v5
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-browser-qa
          path: /tmp/last-chapter-v5-qa
          if-no-files-found: ignore
