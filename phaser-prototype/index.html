<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Останній розділ — Phaser prototype</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #f6dec0;
        background: #19151f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(ellipse at 50% 10%, #47303d, #17131c 75%);
      }
      main {
        width: min(1100px, 100%);
      }
      h1 {
        font-family: Georgia, serif;
        font-size: clamp(24px, 4vw, 40px);
        margin: 0 0 8px;
      }
      p {
        line-height: 1.5;
      }
      #game {
        width: 100%;
        aspect-ratio: 16/9;
        background: #251b29;
        border: 5px solid #8f624e;
        box-shadow: 0 25px 75px #08060b;
      }
      #game canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        touch-action: manipulation;
      }
      #status {
        padding: 16px 20px;
        background: #312632;
        border: 1px solid #70565d;
        min-height: 66px;
      }
      a {
        color: #edbd84;
      }
      small {
        color: #d5b6a5;
      }
      button {
        background: #e3a86f;
        color: #29202b;
        border: 0;
        border-radius: 4px;
        min-height: 42px;
        padding: 10px 14px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #f0bd7e;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #f6dec0;
        outline-offset: 3px;
      }
      @media (max-width: 640px) {
        body {
          padding: 12px;
          place-items: start center;
        }
        #game {
          border-width: 3px;
        }
        #interactions button {
          flex: 1 1 calc(50% - 8px);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Останній розділ <small>· Phaser prototype</small></h1>
      <p>Оновлена книгарня: досліджуйте кімнату, розглядайте книжки та зустрічайте відвідувачів.</p>
      <div id="game" role="group" aria-label="Інтерактивна сцена книгарні"></div>
      <div
        id="interactions"
        aria-label="Предмети книгарні"
        style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px"
      ></div>
      <p id="status" role="status" aria-live="polite">Книгарня прокидається. За вікном дощить…</p>
      <p>
        <small
          >Окремий експеримент: чинна історія та збереження не змінюються.
          <a href="/">Повернутися до гри</a></small
        >
      </p>
      <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
      <script type="module" src="/phaser-prototype/scene.js"></script>
    </main>
  </body>
</html>
