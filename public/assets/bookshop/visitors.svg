<svg xmlns="http://www.w3.org/2000/svg" width="128" height="96" viewBox="0 0 128 96" shape-rendering="crispEdges">
  <title>Original Bellwick bookstore visitors sprite sheet</title>
  <desc>Eight original pixel-art character frames: four for the reader and four for Mara walking.</desc>
  <defs>
    <g id="reader">
      <rect x="10" y="5" width="12" height="3" fill="#503842"/><rect x="8" y="8" width="16" height="8" fill="#503842"/>
      <rect x="9" y="10" width="14" height="12" fill="#e8b58d"/><rect x="7" y="12" width="3" height="9" fill="#503842"/><rect x="22" y="12" width="3" height="9" fill="#503842"/>
      <rect x="12" y="14" width="2" height="2" fill="#302837"/><rect x="19" y="14" width="2" height="2" fill="#302837"/><rect x="14" y="19" width="5" height="1" fill="#b36a5f"/>
      <rect x="7" y="22" width="18" height="16" fill="#81607e"/><rect x="5" y="24" width="3" height="11" fill="#81607e"/><rect x="24" y="24" width="3" height="11" fill="#81607e"/>
    </g>
    <g id="mara">
      <rect x="10" y="5" width="12" height="3" fill="#513740"/><rect x="8" y="8" width="16" height="8" fill="#513740"/>
      <rect x="9" y="10" width="14" height="12" fill="#e8b58d"/><rect x="7" y="12" width="3" height="9" fill="#513740"/><rect x="22" y="12" width="3" height="9" fill="#513740"/>
      <rect x="12" y="14" width="2" height="2" fill="#302837"/><rect x="19" y="14" width="2" height="2" fill="#302837"/><rect x="14" y="19" width="5" height="1" fill="#b36a5f"/>
      <rect x="7" y="22" width="18" height="16" fill="#688e86"/><rect x="5" y="24" width="3" height="11" fill="#688e86"/><rect x="24" y="24" width="3" height="11" fill="#688e86"/>
    </g>
  </defs>
  <g transform="translate(0 0)"><use href="#reader"/><rect x="8" y="38" width="6" height="7" fill="#302837"/><rect x="18" y="38" width="6" height="7" fill="#302837"/></g>
  <g transform="translate(32 0)"><use href="#reader"/><rect x="8" y="38" width="6" height="7" fill="#302837"/><rect x="18" y="38" width="6" height="7" fill="#302837"/><rect x="7" y="37" width="7" height="2" fill="#503842"/></g>
  <g transform="translate(64 0)"><use href="#reader"/><rect x="7" y="38" width="7" height="6" fill="#302837"/><rect x="18" y="39" width="6" height="6" fill="#302837"/></g>
  <g transform="translate(96 0)"><use href="#reader"/><rect x="8" y="39" width="6" height="6" fill="#302837"/><rect x="18" y="38" width="7" height="6" fill="#302837"/></g>
  <g transform="translate(0 48)"><use href="#mara"/><rect x="8" y="38" width="6" height="7" fill="#302837"/><rect x="18" y="38" width="6" height="7" fill="#302837"/></g>
  <g transform="translate(32 48)"><use href="#mara"/><rect x="6" y="38" width="7" height="6" fill="#302837"/><rect x="19" y="39" width="6" height="6" fill="#302837"/><rect x="7" y="37" width="6" height="2" fill="#513740"/></g>
  <g transform="translate(64 48)"><use href="#mara"/><rect x="8" y="39" width="6" height="6" fill="#302837"/><rect x="18" y="38" width="7" height="6" fill="#302837"/></g>
  <g transform="translate(96 48)"><use href="#mara"/><rect x="7" y="38" width="6" height="6" fill="#302837"/><rect x="19" y="39" width="6" height="6" fill="#302837"/><rect x="19" y="37" width="6" height="2" fill="#513740"/></g>
</svg>